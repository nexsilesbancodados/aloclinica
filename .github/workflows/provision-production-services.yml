name: One-shot — Provisionar serviços críticos de produção

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Digite PROVISION para instalar Coturn e sincronizar backup"
        required: true
        type: string

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: pwxvvimdtmvziynbspgx
  VPS_HOST: 72.62.138.208
  VPS_USER: root

jobs:
  provision:
    name: Provisionar Coturn e backup
    if: ${{ inputs.confirm == 'PROVISION' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validar confirmação
        run: |
          set -euo pipefail
          if [[ "${{ inputs.confirm }}" != "PROVISION" ]]; then
            echo "Confirmação inválida."
            exit 1
          fi

      - name: Preparar segredos persistentes e mascarados
        env:
          EXISTING_COTURN_PASS: ${{ secrets.COTURN_PASS }}
          EXISTING_INTERNAL_FUNCTION_SECRET: ${{ secrets.INTERNAL_FUNCTION_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          coturn_pass="${EXISTING_COTURN_PASS:-$(openssl rand -hex 32)}"
          internal_secret="${EXISTING_INTERNAL_FUNCTION_SECRET:-$(openssl rand -hex 32)}"
          echo "::add-mask::$coturn_pass"
          echo "::add-mask::$internal_secret"
          {
            echo "COTURN_PASS=$coturn_pass"
            echo "INTERNAL_FUNCTION_SECRET=$internal_secret"
          } >> "$GITHUB_ENV"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Configurar segredos do Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          supabase secrets set \
            COTURN_HOST="$VPS_HOST" \
            COTURN_PORT=3478 \
            COTURN_USER=mirotalk \
            COTURN_PASS="$COTURN_PASS" \
            INTERNAL_FUNCTION_SECRET="$INTERNAL_FUNCTION_SECRET" \
            --project-ref "$SUPABASE_PROJECT_REF"

      - name: Sincronizar segredo interno no Vault
        env:
          SBP_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          sql="select id from vault.secrets where name = 'internal_function_secret' limit 1;"
          jq -n --arg query "$sql" '{query: $query}' > "$RUNNER_TEMP/query.json"
          http_code="$(curl -sS -w '%{http_code}' -o "$RUNNER_TEMP/query-response.json" \
            -X POST \
            -H "Authorization: Bearer $SBP_TOKEN" \
            -H 'Content-Type: application/json' \
            -A 'aloclinica-maintenance/1.0' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --data-binary @"$RUNNER_TEMP/query.json")"
          if [[ "$http_code" != "200" && "$http_code" != "201" ]]; then
            message="$(jq -r 'if type == "array" then (.[0].message // .[0].error // .[0].hint // "sem detalhe") else (.message // .error // .hint // "sem detalhe") end' "$RUNNER_TEMP/query-response.json" 2>/dev/null || echo 'sem detalhe')"
            echo "Falha ao sincronizar configuração interna do banco (HTTP $http_code): $message"
            exit 1
          fi

          secret_id="$(jq -r '.[0].id // empty' "$RUNNER_TEMP/query-response.json")"
          if [[ -n "$secret_id" ]]; then
            sql="select vault.update_secret('$secret_id'::uuid, '$INTERNAL_FUNCTION_SECRET', 'internal_function_secret', 'Shared secret for internal Edge Function calls');"
          else
            sql="select vault.create_secret('$INTERNAL_FUNCTION_SECRET', 'internal_function_secret', 'Shared secret for internal Edge Function calls');"
          fi
          jq -n --arg query "$sql" '{query: $query}' > "$RUNNER_TEMP/update-vault-query.json"
          http_code="$(curl -sS -w '%{http_code}' -o "$RUNNER_TEMP/update-vault-response.json" \
            -X POST \
            -H "Authorization: Bearer $SBP_TOKEN" \
            -H 'Content-Type: application/json' \
            -A 'aloclinica-maintenance/1.0' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --data-binary @"$RUNNER_TEMP/update-vault-query.json")"
          if [[ "$http_code" != "200" && "$http_code" != "201" ]]; then
            echo "Falha ao gravar segredo interno no Vault (HTTP $http_code)."
            exit 1
          fi

          sql="select decrypted_secret is not null as configured from vault.decrypted_secrets where name = 'internal_function_secret' limit 1;"
          jq -n --arg query "$sql" '{query: $query}' > "$RUNNER_TEMP/verify-query.json"
          curl -sS -f \
            -X POST \
            -H "Authorization: Bearer $SBP_TOKEN" \
            -H 'Content-Type: application/json' \
            -A 'aloclinica-maintenance/1.0' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --data-binary @"$RUNNER_TEMP/verify-query.json" > "$RUNNER_TEMP/verify-response.json"
          jq -e '.[0].configured == true' "$RUNNER_TEMP/verify-response.json" >/dev/null

      - name: Aplicar compatibilidade da auditoria
        env:
          SBP_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          jq -Rs '{query: .}' supabase/migrations/20260813100000_activity_logs_compatibility.sql > "$RUNNER_TEMP/activity-logs-migration.json"
          http_code="$(curl -sS -w '%{http_code}' -o "$RUNNER_TEMP/activity-logs-migration-response.json" \
            -X POST \
            -H "Authorization: Bearer $SBP_TOKEN" \
            -H 'Content-Type: application/json' \
            -A 'aloclinica-maintenance/1.0' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --data-binary @"$RUNNER_TEMP/activity-logs-migration.json")"
          if [[ "$http_code" != "200" && "$http_code" != "201" ]]; then
            echo "Falha ao aplicar compatibilidade da auditoria (HTTP $http_code)."
            jq -c '.' "$RUNNER_TEMP/activity-logs-migration-response.json" || true
            exit 1
          fi

      - name: Atualizar funÃ§Ã£o de chamadas internas
        env:
          SBP_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          jq -Rs '{query: .}' supabase/migrations/20260812150000_internal_function_secret_vault.sql > "$RUNNER_TEMP/function-migration.json"
          http_code="$(curl -sS -w '%{http_code}' -o "$RUNNER_TEMP/function-migration-response.json" \
            -X POST \
            -H "Authorization: Bearer $SBP_TOKEN" \
            -H 'Content-Type: application/json' \
            -A 'aloclinica-maintenance/1.0' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --data-binary @"$RUNNER_TEMP/function-migration.json")"
          if [[ "$http_code" != "200" && "$http_code" != "201" ]]; then
            echo "Falha ao atualizar a funÃ§Ã£o de chamadas internas (HTTP $http_code)."
            exit 1
          fi

      - name: Instalar e configurar Coturn na VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          VPS_HOST: ${{ env.VPS_HOST }}
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          envs: COTURN_PASS,VPS_HOST
          timeout: 300s
          command_timeout: 20m
          script: |
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            if ! command -v turnserver >/dev/null 2>&1; then
              apt-get update -qq
              apt-get install -y -qq coturn
            fi

            write_coturn_config() {
              local target="$1"
              local temporary="${target}.aloclinica.tmp"
              install -d -m 0750 "$(dirname "$target")"
              umask 077
              cat > "$temporary" <<EOF
            listening-port=3478
            listening-ip=${VPS_HOST}
            external-ip=${VPS_HOST}
            relay-ip=${VPS_HOST}
            fingerprint
            lt-cred-mech
            user=mirotalk:${COTURN_PASS}
            realm=aloclinica.com.br
            server-name=aloclinica.com.br
            min-port=49152
            max-port=65535
            no-tls
            no-dtls
            no-multicast-peers
            denied-peer-ip=0.0.0.0-0.255.255.255
            denied-peer-ip=10.0.0.0-10.255.255.255
            denied-peer-ip=127.0.0.0-127.255.255.255
            denied-peer-ip=169.254.0.0-169.254.255.255
            denied-peer-ip=172.16.0.0-172.31.255.255
            denied-peer-ip=192.168.0.0-192.168.255.255
            denied-peer-ip=224.0.0.0-255.255.255.255
            stale-nonce
            simple-log
            log-file=stdout
            EOF
              chmod 600 "$temporary"
              chown root:root "$temporary"
              mv -f "$temporary" "$target"
            }

            if [ -f /etc/default/coturn ]; then
              sed -i '/^TURNSERVER_ENABLED=/d' /etc/default/coturn
              echo 'TURNSERVER_ENABLED=1' >> /etc/default/coturn
            fi

            if command -v docker >/dev/null 2>&1 && docker inspect coturn >/dev/null 2>&1; then
              systemctl mask --runtime --now coturn.service || true
              config_target="$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/etc/coturn/turnserver.conf"}}{{.Source}}{{end}}{{end}}' coturn)"
              if [ -z "$config_target" ] || [ "${config_target#/}" = "$config_target" ]; then
                echo 'O container Coturn não possui uma configuração montada em caminho absoluto.'
                exit 1
              fi
              write_coturn_config "$config_target"
              docker update --restart unless-stopped coturn >/dev/null
              docker restart coturn >/dev/null
            else
              systemctl daemon-reload || true
              if [ -f /usr/lib/systemd/system/coturn.service ] || [ -f /etc/systemd/system/coturn.service ]; then
                turn_service=coturn
              elif [ -f /usr/lib/systemd/system/turnserver.service ] || [ -f /etc/systemd/system/turnserver.service ]; then
                turn_service=turnserver
              else
                echo 'Serviço systemd do Coturn não foi encontrado.'
                exit 1
              fi
              systemctl unmask --runtime "$turn_service" || true
              systemctl disable "$turn_service" || true
              systemctl reset-failed "$turn_service" || true
              systemctl enable "$turn_service"
              systemctl start "$turn_service"
            fi

            if command -v ufw >/dev/null 2>&1 && ufw status | grep -q 'Status: active'; then
              ufw allow 3478/tcp
              ufw allow 3478/udp
              ufw allow 49152:65535/udp
            fi

            for attempt in $(seq 1 20); do
              if ss -lntup 2>/dev/null | grep -E ':(3478)\b'; then
                break
              fi
              sleep 1
            done
            ss -lntup | grep -E ':(3478)\b'
            echo 'Coturn ativo.'

      - name: Executar backup real e validar registro
        env:
          SBP_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          function_url="https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/daily-backup"
          response_file="$RUNNER_TEMP/backup-response.json"
          http_code="$(curl -sS -w '%{http_code}' -o "$response_file" \
            -X POST "$function_url" \
            -H "Authorization: Bearer $ANON_KEY" \
            -H "apikey: $ANON_KEY" \
            -H "x-internal-secret: $INTERNAL_FUNCTION_SECRET" \
            -H 'Content-Type: application/json' \
            --data '{"source":"production-provisioning"}')"
          if [[ "$http_code" != "200" ]]; then
            echo "Backup não foi concluído (HTTP $http_code)."
            jq -c '{ok, error, date, summary, failures}' "$response_file" || true
            exit 1
          fi
          jq -c '{ok, date, summary}' "$response_file"
          jq -e '.ok == true' "$response_file" >/dev/null

          sql="select column_name, data_type from information_schema.columns where table_schema = 'public' and table_name = 'activity_logs' order by ordinal_position;"
          jq -n --arg query "$sql" '{query: $query}' > "$RUNNER_TEMP/activity-schema-query.json"
          curl -sS -f \
            -X POST \
            -H "Authorization: Bearer $SBP_TOKEN" \
            -H 'Content-Type: application/json' \
            -A 'aloclinica-maintenance/1.0' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --data-binary @"$RUNNER_TEMP/activity-schema-query.json" | jq -c '.'

          sql="select name from storage.objects where bucket_id = 'backups' and name like '$(jq -r '.date' "$response_file")/%' order by name;"
          jq -n --arg query "$sql" '{query: $query}' > "$RUNNER_TEMP/backup-objects-query.json"
          curl -sS -f \
            -X POST \
            -H "Authorization: Bearer $SBP_TOKEN" \
            -H 'Content-Type: application/json' \
            -A 'aloclinica-maintenance/1.0' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --data-binary @"$RUNNER_TEMP/backup-objects-query.json" | jq -c '.'

          sql="select max(created_at) as last_backup from public.activity_logs where action = 'daily_backup_run';"
          jq -n --arg query "$sql" '{query: $query}' > "$RUNNER_TEMP/backup-query.json"
          http_code="$(curl -sS -w '%{http_code}' -o "$RUNNER_TEMP/backup-query-response.json" \
            -X POST \
            -H "Authorization: Bearer $SBP_TOKEN" \
            -H 'Content-Type: application/json' \
            -A 'aloclinica-maintenance/1.0' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --data-binary @"$RUNNER_TEMP/backup-query.json")"
          if [[ "$http_code" != "200" && "$http_code" != "201" ]]; then
            echo "Não foi possível validar o registro do backup (HTTP $http_code)."
            exit 1
          fi
          jq -c '.' "$RUNNER_TEMP/backup-query-response.json"
          jq -e 'length > 0 and .[0].last_backup != null' "$RUNNER_TEMP/backup-query-response.json" >/dev/null

      - name: Resumo seguro
        run: |
          {
            echo '## Provisionamento concluído'
            echo ''
            echo '- Coturn instalado na VPS e escutando TCP/UDP 3478.'
            echo '- Credenciais do Coturn sincronizadas no Supabase.'
            echo '- Segredo interno sincronizado entre Edge Functions e banco.'
            echo '- Backup real executado e registrado em `activity_logs`.'
            echo '- Valores de segredo não são exibidos nem gravados no repositório.'
          } >> "$GITHUB_STEP_SUMMARY"
