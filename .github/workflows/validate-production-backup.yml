name: Validar backup de produção

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Digite BACKUP para aplicar a compatibilidade e executar um backup real"
        required: true
        type: string

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: pwxvvimdtmvziynbspgx

jobs:
  backup:
    name: Aplicar migration e validar backup
    if: ${{ inputs.confirm == 'BACKUP' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Obter chave service_role somente em memória
        env:
          SBP_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -f \
            -H "Authorization: Bearer $SBP_TOKEN" \
            -A 'aloclinica-maintenance/1.0' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys" > "$RUNNER_TEMP/api-keys.json"
          jq -r '.[] | [.name, .type, .prefix] | @tsv' "$RUNNER_TEMP/api-keys.json"
          service_role_key="$(jq -r '.[] | select(.name == "service_role" or .type == "service_role") | .api_key // empty' "$RUNNER_TEMP/api-keys.json" | head -1)"
          if [[ -z "$service_role_key" ]]; then
            echo 'A chave service_role não foi retornada pela Management API.'
            exit 1
          fi
          echo "::add-mask::$service_role_key"
          echo "SERVICE_ROLE_KEY=$service_role_key" >> "$GITHUB_ENV"

      - name: Sincronizar segredos persistentes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          COTURN_PASS: ${{ secrets.COTURN_PASS }}
          INTERNAL_FUNCTION_SECRET: ${{ secrets.INTERNAL_FUNCTION_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          supabase secrets set \
            COTURN_HOST=72.62.138.208 \
            COTURN_PORT=3478 \
            COTURN_USER=mirotalk \
            COTURN_PASS="$COTURN_PASS" \
            INTERNAL_FUNCTION_SECRET="$INTERNAL_FUNCTION_SECRET" \
            --project-ref "$SUPABASE_PROJECT_REF"

      - name: Sincronizar segredo interno no Vault
        env:
          SBP_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          INTERNAL_FUNCTION_SECRET: ${{ secrets.INTERNAL_FUNCTION_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          sql="select id from vault.secrets where name = 'internal_function_secret' limit 1;"
          jq -n --arg query "$sql" '{query: $query}' > "$RUNNER_TEMP/vault-query.json"
          curl -sS -f \
            -X POST \
            -H "Authorization: Bearer $SBP_TOKEN" \
            -H 'Content-Type: application/json' \
            -A 'aloclinica-maintenance/1.0' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --data-binary @"$RUNNER_TEMP/vault-query.json" > "$RUNNER_TEMP/vault-query-response.json"
          secret_id="$(jq -r '.[0].id // empty' "$RUNNER_TEMP/vault-query-response.json")"
          if [[ -n "$secret_id" ]]; then
            sql="select vault.update_secret('$secret_id'::uuid, '$INTERNAL_FUNCTION_SECRET', 'internal_function_secret', 'Shared secret for internal Edge Function calls');"
          else
            sql="select vault.create_secret('$INTERNAL_FUNCTION_SECRET', 'internal_function_secret', 'Shared secret for internal Edge Function calls');"
          fi
          jq -n --arg query "$sql" '{query: $query}' > "$RUNNER_TEMP/vault-update-query.json"
          curl -sS -f \
            -X POST \
            -H "Authorization: Bearer $SBP_TOKEN" \
            -H 'Content-Type: application/json' \
            -A 'aloclinica-maintenance/1.0' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --data-binary @"$RUNNER_TEMP/vault-update-query.json" >/dev/null

      - name: Aplicar compatibilidade antes do deploy
        env:
          SBP_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          jq -Rs '{query: .}' supabase/migrations/20260813100000_activity_logs_compatibility.sql > "$RUNNER_TEMP/activity-logs-migration-before-deploy.json"
          curl -sS -f \
            -X POST \
            -H "Authorization: Bearer $SBP_TOKEN" \
            -H 'Content-Type: application/json' \
            -A 'aloclinica-maintenance/1.0' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --data-binary @"$RUNNER_TEMP/activity-logs-migration-before-deploy.json" >/dev/null
          jq -Rs '{query: .}' supabase/migrations/20260812150000_internal_function_secret_vault.sql > "$RUNNER_TEMP/internal-function-migration-before-deploy.json"
          curl -sS -f \
            -X POST \
            -H "Authorization: Bearer $SBP_TOKEN" \
            -H 'Content-Type: application/json' \
            -A 'aloclinica-maintenance/1.0' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --data-binary @"$RUNNER_TEMP/internal-function-migration-before-deploy.json" >/dev/null

      - name: Verificar sincronização sem revelar segredos
        env:
          SBP_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          INTERNAL_FUNCTION_SECRET: ${{ secrets.INTERNAL_FUNCTION_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          local_hash="$(printf '%s' "$INTERNAL_FUNCTION_SECRET" | md5sum | awk '{print $1}')"
          sql="select md5(decrypted_secret) as vault_hash from vault.decrypted_secrets where name = 'internal_function_secret' limit 1;"
          jq -n --arg query "$sql" '{query: $query}' > "$RUNNER_TEMP/hash-query.json"
          vault_hash="$(curl -sS -f \
            -X POST \
            -H "Authorization: Bearer $SBP_TOKEN" \
            -H 'Content-Type: application/json' \
            -A 'aloclinica-maintenance/1.0' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --data-binary @"$RUNNER_TEMP/hash-query.json" | jq -r '.[0].vault_hash // "missing"')"
          echo "local_secret_hash=$local_hash"
          echo "vault_secret_hash=$vault_hash"
          rpc_response="$(curl -sS -w '\n%{http_code}' -o "$RUNNER_TEMP/rpc-response.json" \
            -X POST \
            -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
            -H "apikey: $SERVICE_ROLE_KEY" \
            -H 'Content-Type: application/json' \
            "https://$SUPABASE_PROJECT_REF.supabase.co/rest/v1/rpc/verify_internal_function_secret" \
            --data "{\"candidate_secret\":\"$INTERNAL_FUNCTION_SECRET\"}")"
          echo "vault_rpc_http=$(tail -1 <<< "$rpc_response")"
          echo "vault_rpc_result=$(jq -c '.' "$RUNNER_TEMP/rpc-response.json")"

      - name: Publicar daily-backup
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy daily-backup --project-ref "$SUPABASE_PROJECT_REF"

      - name: Aplicar compatibilidade da auditoria
        env:
          SBP_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          jq -Rs '{query: .}' supabase/migrations/20260813100000_activity_logs_compatibility.sql > "$RUNNER_TEMP/activity-logs-migration.json"
          http_code="$(curl -sS -w '%{http_code}' -o "$RUNNER_TEMP/activity-logs-migration-response.json" \
            -X POST \
            -H "Authorization: Bearer $SBP_TOKEN" \
            -H 'Content-Type: application/json' \
            -A 'aloclinica-maintenance/1.0' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --data-binary @"$RUNNER_TEMP/activity-logs-migration.json")"
          if [[ "$http_code" != "200" && "$http_code" != "201" ]]; then
            echo "Falha ao aplicar compatibilidade da auditoria (HTTP $http_code)."
            jq -c '.' "$RUNNER_TEMP/activity-logs-migration-response.json" || true
            exit 1
          fi

      - name: Executar backup real
        env:
          ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          INTERNAL_FUNCTION_SECRET: ${{ secrets.INTERNAL_FUNCTION_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          function_url="https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/daily-backup"
          response_file="$RUNNER_TEMP/backup-response.json"
          authorization_key="${SERVICE_ROLE_KEY:-$ANON_KEY}"
          http_code=000
          for attempt in $(seq 1 3); do
            http_code="$(curl -sS -w '%{http_code}' -o "$response_file" \
              -X POST "$function_url" \
              -H "Authorization: Bearer $authorization_key" \
              -H "apikey: $authorization_key" \
              -H "x-internal-secret: $INTERNAL_FUNCTION_SECRET" \
              -H "x-aloclinica-internal-secret: $INTERNAL_FUNCTION_SECRET" \
              -H 'Content-Type: application/json' \
              --data '{"source":"production-backup-validation"}')"
            if [[ "$http_code" == "200" ]]; then
              break
            fi
            echo "Tentativa $attempt retornou HTTP $http_code; aguardando propagação do segredo."
            sleep 10
          done
          if [[ "$http_code" != "200" ]]; then
            echo "Backup não foi concluído (HTTP $http_code)."
            jq -c '{ok, error, date, summary, failures}' "$response_file" || true
            exit 1
          fi
          jq -c '{ok, date, summary}' "$response_file"
          jq -e '.ok == true' "$response_file" >/dev/null

      - name: Diagnóstico seguro do runtime
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set +e
          supabase functions logs daily-backup --project-ref "$SUPABASE_PROJECT_REF" --limit 20 2>&1 \
            | sed -E 's/(internalHeaderPresent|internalSecretConfigured|bearerPresent|status|code)[=:][[:space:]]*[^,} ]+/\\1=[REDACTED]/g' \
            | tail -80

      - name: Validar Storage e auditoria
        env:
          SBP_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          run_query() {
            local sql="$1"
            local payload="$RUNNER_TEMP/query.json"
            jq -n --arg query "$sql" '{query: $query}' > "$payload"
            curl -sS -f \
              -X POST \
              -H "Authorization: Bearer $SBP_TOKEN" \
              -H 'Content-Type: application/json' \
              -A 'aloclinica-maintenance/1.0' \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
              --data-binary @"$payload"
          }
          backup_date="$(jq -r '.date' "$RUNNER_TEMP/backup-response.json")"
          echo '=== backup objects ==='
          objects="$(run_query "select count(*)::int as total from storage.objects where bucket_id = 'backups' and name like '${backup_date}/%';")"
          echo "$objects" | jq -c '.'
          jq -e '.[0].total >= 9' <<< "$objects" >/dev/null

          echo '=== audit record ==='
          audit="$(run_query "select action, created_at, details from public.activity_logs where action = 'daily_backup_run' order by created_at desc limit 1;")"
          echo "$audit" | jq -c '.'
          jq -e 'length == 1 and .[0].action == "daily_backup_run"' <<< "$audit" >/dev/null

      - name: Resumo seguro
        run: |
          {
            echo '## Backup de produção validado'
            echo ''
            echo '- Migration de compatibilidade da auditoria aplicada.'
            echo '- Backup real executado com sucesso.'
            echo '- Arquivos do Storage e registro de auditoria validados.'
            echo '- Nenhum segredo foi exibido ou gravado no repositório.'
          } >> "$GITHUB_STEP_SUMMARY"
